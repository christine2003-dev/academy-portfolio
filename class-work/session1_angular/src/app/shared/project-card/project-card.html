<div class="details-container color-container">
  <div class="article-container">
    <img [src]="imageSrc" [alt]="title" class="project-img" />
  </div>

  <h2 class="experience-sub-title project-title">{{ title }}</h2>

  <div class="btn-container">
    <app-button
      label="Github"
      variant="outline"
      extraClass="project-btn"
      [href]="githubUrl"
    ></app-button>

    <app-button
      label="Live Demo"
      variant="outline"
      extraClass="project-btn"
      [href]="demoUrl"
    ></app-button>
  </div>
</div>
