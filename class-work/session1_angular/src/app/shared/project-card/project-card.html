<div class="details-container color-container">
  <div class="article-container">
    <img
      [src]="imageSrc"
      [alt]="title"
      class="project-img"
    />
  </div>

  <h2 class="experience-sub-title project-title">
    {{ title }}
  </h2>

  <div class="btn-container">
    <button
      class="btn btn-color-2 project-btn"
      (click)="open(githubUrl)"
    >
      Github
    </button>

    <button
      class="btn btn-color-2 project-btn"
      (click)="open(demoUrl)"
    >
      Live Demo
    </button>
  </div>
</div>
